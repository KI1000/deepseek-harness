# Opt-in Feishu channel overlay over the shipped Web composition. The second
# WebServer lives in an isolated realm so exposing it never exposes the UI API.

- insert:
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: feishu-channel-ingress
      name: cordis:group
      group: true
      isolate:
        webServer: true
      config:
        - id: feishu-webhook-server
          name: '@deepseek-ai/dsh-host-webserver'
          config:
            host: '127.0.0.1'
            port: !!js Number(process.env.DSH_FEISHU_WEBHOOK_PORT ?? 3082)

        - id: feishu-webhook-adapter
          name: '@deepseek-ai/dsh-webhook-feishu'
          config:
            source: primary-feishu
            path: /webhook/feishu
            tokenEnv: DSH_FEISHU_VERIFICATION_TOKEN
            maxBodyBytes: 1048576
            appIdEnv: DSH_FEISHU_APP_ID
            appSecretEnv: DSH_FEISHU_APP_SECRET
            workspacePath: !!js process.env.DSH_FEISHU_WORKSPACE ?? process.cwd()
            agentPreset: !!js process.env.DSH_FEISHU_AGENT_PRESET ?? 'standard'
            permissionPreset: !!js process.env.DSH_FEISHU_PERMISSION_PRESET ?? 'read-only'
