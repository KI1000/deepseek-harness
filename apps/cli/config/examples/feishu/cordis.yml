# Opt-in Feishu channel overlay over the shipped Web composition. Deliveries are
# supplied by an external transport such as the Feishu long-connection ingress;
# this package owns the rule, Session continuity, and outbound replies only.

- insert:
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: feishu-channel
      name: '@deepseek-ai/dsh-webhook-feishu'
      config:
        source: primary-feishu
        appIdEnv: DSH_FEISHU_APP_ID
        appSecretEnv: DSH_FEISHU_APP_SECRET
        workspacePath: !!js process.env.DSH_FEISHU_WORKSPACE ?? process.cwd()
        agentPreset: !!js process.env.DSH_FEISHU_AGENT_PRESET ?? 'standard'
        permissionPreset: !!js process.env.DSH_FEISHU_PERMISSION_PRESET ?? 'read-only'
